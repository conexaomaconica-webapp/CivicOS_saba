name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ios.yml'

jobs:
  build-ios:
    name: Build iOS Project (macOS)
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Assets and Monorepo Dependencies
        run: pnpm turbo run build --filter=@saas/mobile...

      - name: Setup and Sync Capacitor iOS
        run: |
          cd apps/mobile
          if [ ! -d "ios" ]; then
            echo "Criando pasta nativa iOS com Capacitor..."
            npx cap add ios
          else
            echo "Sincronizando pasta nativa iOS..."
            npx cap sync ios
          fi
          echo "Aplicando overrides do iOS..."
          node scripts/apply-ios-overrides.mjs

      - name: Ensure CocoaPods Dependencies
        run: |
          cd apps/mobile/ios/App
          pod install --repo-update

      - name: Build Xcode Project (Unsigned Validation)
        run: |
          cd apps/mobile/ios/App
          set -o pipefail
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            MARKETING_VERSION="1.0.0" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee xcodebuild.log

      - name: Archive xcodebuild logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-log
          path: apps/mobile/ios/App/xcodebuild.log
          if-no-files-found: warn

      # -----------------------------------------------------------------------
      # Gate iOS 02B (Estrutura futura de assinatura e exportação do IPA)
      # Inativa até o provisionamento das secrets da Apple Developer Account.
      # Preserva integralmente o Gate 01 sem executar chamadas externas ou builds assinados.
      # -----------------------------------------------------------------------
